# Bundle patch for @just-genius/dsh-model-custom-ex.
#
# Installs the plugin's loader row into the tree. The host half owns the
# per-model default-effort settings namespace; the browser half owns the UI.

- insert:
    - id: dsh-model-custom-ex
      name: '@just-genius/dsh-model-custom-ex'

# Disable the official Models settings plugin: this package forks it (same
# section id/locale/onboarding) to add per-model vision + reasoning-effort
# selectors. Without this disable, both plugins would register a "models"
# section and the nav rail would show two identical "Models" tabs. Bundle
# patches apply in profile bundle order, and this package is listed after
# @deepseek-ai/dsh-web-app, so the override lands after the official insert.
- id: ui-settings-models
  disabled: true
