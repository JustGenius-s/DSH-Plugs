# Bundle patch for @just-genius/dsh-session-archive.
#
# Host half lists archived sessions, unarchives them (archive set only), and
# deletes them (archive set + log files). Browser half adds Settings → 会话归档
# and keeps sidebar archive one-click. DSH 0.1.7 has no separate official
# archive settings page; its archive view lives in the sidebar filter.

- insert:
    - id: dsh-session-archive
      name: '@just-genius/dsh-session-archive'
