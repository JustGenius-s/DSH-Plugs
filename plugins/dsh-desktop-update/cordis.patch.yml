# Bundle patch for @just-genius/dsh-desktop-update.
#
# Installing this package joins it to the profile's bundle stack because
# package.json declares `dsh.bundle.patch`. This patch inserts the plugin's
# loader row into the tree; the row's `name` is the module specifier the
# loader imports (the package's own name). The host owns update detection and
# live settings; omitted configuration resolves through the Config defaults.

- insert:
    - id: desktop-update
      name: '@just-genius/dsh-desktop-update'
